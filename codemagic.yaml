workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Test
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.arpyfamily.barwars
      node: 22.0.0
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Build iOS
        script: |
          xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-build:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 22.0.0
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build Android
        script: |
          cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
