workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Admin
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.arpyfamily.barwars
      node: 22.0.0
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/**/*.xcarchive


  android-build:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 22.0.0
      java: 21
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build Android
        script: cd android && chmod +x gradlew && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
